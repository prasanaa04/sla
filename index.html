<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discriptive list</title>
    <style>
     
    body {
            font-family: Arial, sans-serif;
            background-color: lightyellow;
            margin: 30px;
        }

        h1 {
            color: darkblue;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 3px gray;
        }

        dl {
            background-color: white;
            border: 2px solid navy;
            padding: 20px;
            border-radius: 10px;
        }

        dt {
            color: red;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
        }

        dd {
            color: darkgreen;
            font-size: 16px;
            margin-bottom: 20px;
       
        }
    </style>

</head>
<body>
    <h1>Web Development</h1>

   <dl>
    <dt>HTML</dt>
    <dd>HTML are used for creating structure for web page</dd>

    <dt>CSS</dt>
    <dd>CSS is used for creating style & design for webpage</dd>

    <dt>Java script</dt>
    <dd> Java script used for instation with users</dd>
   </dl>

</body>
</html>
