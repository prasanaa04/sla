<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables Task</title>
    <style>
        table, th, td{
            border: 2px solid #000;
            border-collapse: collapse;
        }
        th, td{
            padding: 8px 16px;
        }
        p{
            background-color: yellow;
            padding: 12px 16px;
            border-radius: 8px;
        }
        span{
            background-color: #fff;
            padding: 8px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
